
name: Build and deploy StudentMarket to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Install dependencies
        working-directory: ./backend/server
        run: npm install

      - name: Build application
        working-directory: ./backend/server
        run: npm run build --if-present

      - name: Run tests
        working-directory: ./backend/server
        run: npm run test --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/server/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_806D5DD8E0AB45938A2108BF77F0F619 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_30EF8EA030D6495CAEB7F447D0772955 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6C8B8F02BA3B42A2935EEBA80356EA5C }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Student-Market'
          slot-name: 'Production'
          package: .
